# =============================================================================
# CloudCut — full-stack override
#
# Adds backend / worker / frontend containers on top of docker-compose.yml.
# Source-mounted with cargo-watch (Rust) / Vite (frontend) for hot reload.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up
#
# NOTE: frontend service is wired in Phase 1 (when frontend/Dockerfile.dev
# exists). Backend / worker containers compile placeholder binaries today and
# gain real behaviour in Phase 3 / 4.
# =============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: cloudcut-backend
    environment:
      DATABASE_URL: postgresql://cloudcut:cloudcut_dev@postgres:5432/cloudcut
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: cloudcut
      S3_SECRET_KEY: cloudcut_dev_secret
      S3_BUCKET: cloudcut-assets
      JWT_SECRET: dev-secret-change-me-min-32-bytes
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
      RUST_LOG: backend=debug,tower_http=info,sqlx=warn
    ports:
      - "8080:8080"
    volumes:
      - ./Cargo.toml:/app/Cargo.toml
      - ./backend:/app/backend
      - ./worker:/app/worker
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.dev
    container_name: cloudcut-worker
    environment:
      DATABASE_URL: postgresql://cloudcut:cloudcut_dev@postgres:5432/cloudcut
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: cloudcut
      S3_SECRET_KEY: cloudcut_dev_secret
      S3_BUCKET: cloudcut-assets
      RUST_LOG: worker=debug,sqlx=warn
    volumes:
      - ./Cargo.toml:/app/Cargo.toml
      - ./backend:/app/backend
      - ./worker:/app/worker
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cloudcut-frontend
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_PUSHER_KEY: dev-pusher-key
      VITE_PUSHER_CLUSTER: ap1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the container's node_modules from being
      # shadowed by the host bind mount (which has none on bare clones).
      - /app/node_modules

volumes:
  cargo_registry:
  cargo_target:
