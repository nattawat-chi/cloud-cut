# =============================================================================
# CloudCut — production-ish compose
#
# Builds multi-stage release images. Assumes Postgres / Redis / S3 are managed
# externally (or supplied via this same compose file in a private network).
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# =============================================================================
name: cloudcut-prod

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: cloudcut/backend:latest
    container_name: cloudcut-backend-prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      RUST_LOG: info
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    image: cloudcut/worker:latest
    container_name: cloudcut-worker-prod
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      REDIS_URL: ${REDIS_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
      RUST_LOG: info
    restart: unless-stopped

